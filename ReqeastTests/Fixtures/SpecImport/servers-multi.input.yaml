openapi: 3.0.0
info:
  title: Multi-server API
  version: 1.0.0
servers:
  - url: https://api.example.test/{environment}
    description: Primary API
    variables:
      environment:
        default: production
        enum:
          - production
          - staging
  - url: https://sandbox.example.test
    description: Sandbox
  - url: https://eu.example.test
    description: EU region
paths:
  /status:
    get:
      summary: Health check
      operationId: getStatus
      responses:
        "200":
          description: ok
  /users:
    get:
      summary: List users
      operationId: listUsers
      servers:
        - url: https://users.example.test
      responses:
        "200":
          description: ok