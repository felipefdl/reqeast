        - $ref: "#/components/schemas/RoamLikeHomeBalancePolicy"
    RoamLikeHomeBalancePolicy:
      type: object
      properties:
        type:
          type: string
          description: The type of Policy
          enum:
            - roam_like_home
        unit:
          type: string
          description: The balance unit
          enum:
            - bytes
        max_unit_count:
          type: integer
          format: int64
          description: The maximum count of the allowance unit could be spend under the policy
        remaining:
          type: integer
          format: int64
          description: The remaining balance
