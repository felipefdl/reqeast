          type: object
          description: The product to build the pre contract summary.
          properties:
            product_offering_id:
              description: The Product Offering Id
              type: string
            price_alteration:
              description: A list of Price Alterations
              type: object
              properties:
                amount:
                  description: The unit amount for the product, positive integer in cents. This should be a whole number and represent the smallest unit of the currency.
                  type: integer
              required:
                - amount
