              type: array
              items:
                type: object
                description: The Discount information.
                oneOf:
                  - $ref: '#/components/schemas/PreContractProductDiscountAmount'
                  - $ref: '#/components/schemas/PreContractProductDiscountPercentage'
                discriminator:
                  propertyName: type
                  mapping:
                    amount: '#/components/schemas/PreContractProductDiscountAmount'
                    percentage: '#/components/schemas/PreContractProductDiscountPercentage'
          required:
            - product_offering_id
      required:
        - type
