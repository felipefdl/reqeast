    CancelProduct:
      type: object
      properties:
        cancellation_mode:
          type: string
          description: The mode of cancellation
          enum:
            - immediate
            - end_of_cycle
      required:
        - cancellation_mode
    PatchProduct:
      type: object
      properties:
        prices:
          type: array
          items:
            $ref: '#/components/schemas/RecurrentPriceAlteration'
      required:
        - prices
    ProductsSummaryList:
      type: object
      properties:
        _embedded:
          description: The embedded resources
          type: object
          properties:
            products:
              description: The list of Products
              type: array
              maxItems: 40
              items:
                $ref: '#/components/schemas/ProductResponseOneOf'
          required:
            - products
        _links:
          description: The pagination links
          $ref: '#/components/schemas/Pagination'
      required:
        - _embedded
        - _links
    ProductResponseOneOf:
      anyOf:
        - $ref: '#/components/schemas/ProductResponseAcquired'
        - $ref: '#/components/schemas/ProductResponseActive'
        - $ref: '#/components/schemas/ProductResponseScheduled'
        - $ref: '#/components/schemas/ProductResponsePending'
        - $ref: '#/components/schemas/ProductResponseTerminatedDepleted'
        - $ref: '#/components/schemas/ProductResponseCanceled'
        - $ref: '#/components/schemas/ProductResponseExpired'
      discriminator:
        propertyName: status
        mapping:
          acquired: '#/components/schemas/ProductResponseAcquired'
          active: '#/components/schemas/ProductResponseActive'
          scheduled: '#/components/schemas/ProductResponseScheduled'
          pending: '#/components/schemas/ProductResponsePending'
          canceled: '#/components/schemas/ProductResponseCanceled'
          depleted: '#/components/schemas/ProductResponseTerminatedDepleted'
          terminated: '#/components/schemas/ProductResponseTerminatedDepleted'
          expired: '#/components/schemas/ProductResponseExpired'
    ProductCreatedAcquired:
      allOf:
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ProductId"
            status:
              type: string
              enum:
                - active
            created_at:
              $ref: "#/components/schemas/CreatedAt"
            acquired_at:
              $ref: "#/components/schemas/ProductAcquiredAt"
        - type: object
          properties:
            _links:
              description: The links related to the Product
              allOf:
                - $ref: '#/components/schemas/ProductLinks'
          required:
            - id
            - status
            - created_at
            - acquired_at
            - _links

    ProductResponseAcquired:
      allOf:
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/ProductId"
            status:
              type: string
              enum:
                - acquired
            created_at:
              $ref: "#/components/schemas/CreatedAt"
            acquired_at:
              $ref: "#/components/schemas/ProductAcquiredAt"
        - $ref: "#/components/schemas/ProductResponseBase"
        - type: object
          properties:
            _links:
              description: The links related to the Product
              allOf:
                - $ref: '#/components/schemas/ProductLinks'
          required:
            - id
            - status
            - created_at
            - acquired_at
            - _links
    ProductCanceledOneOf:
      oneOf:
        - $ref: '#/components/schemas/ProductResponseActive'
        - $ref: '#/components/schemas/ProductResponseCanceled'
      discriminator:
        propertyName: status
        mapping:
          active: '#/components/schemas/ProductResponseActive'
          canceled: '#/components/schemas/ProductResponseCanceled'
    ProductResponseActive:
      allOf:
        - type: object
          properties:
            id:
              $ref: '#/components/schemas/ProductId'
            status:
              type: string
              enum:
                - active
            refundable:
              $ref: '#/components/schemas/Refundable'
            created_at:
              $ref: '#/components/schemas/CreatedAt'
            start_at:
              $ref: '#/components/schemas/ProductStartAt'
            started_at:
              $ref: '#/components/schemas/ProductStartedAt'
            end_at:
              $ref: '#/components/schemas/ProductEndAt'
            expire_at:
              $ref: '#/components/schemas/ProductExpireAt'
            cycle_end_at:
              $ref: '#/components/schemas/ProductCycleEndAt'
            billing_cycle_end_at:
              $ref: '#/components/schemas/ProductBillingCycleEndAt'
        - $ref: '#/components/schemas/ProductResponseBase'
        - type: object
          properties:
            _links:
              description: The links related to the Product
              allOf:
                - $ref: '#/components/schemas/ProductLinks'
                - $ref: '#/components/schemas/ProductCancelLink'
                  required:
                    - cancel
          required:
