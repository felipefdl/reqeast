  securitySchemes:
    oAuth2:
      type: oauth2
      description: The 1GLOBAL Connect API uses OAuth2 Client Credentials type to authenticate its requests. Please be aware that these tokens have a limited duration so you need to include refresh logic in the client code, so that the token gets refreshed automatically without breaking the user experience.
      flows:
        clientCredentials:
          tokenUrl: https://api.1global.com/auth/realms/1global-connect/protocol/openid-connect/token
          refreshUrl: https://api.1global.com/auth/realms/1global-connect/protocol/openid-connect/token
          scopes: {}
    basicAuth:
      type: http
      scheme: basic
      description: Basic authentication for webhooks
  schemas:
    CreateVerificationRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateSmsVerificationRequest'
      discriminator:
        propertyName: channel
        mapping:
          sms: '#/components/schemas/CreateSmsVerificationRequest'
    CreateSmsVerificationRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        phone_number:
          description: The phone number to send the verification to
          $ref: '#/components/schemas/Msisdn'
      required:
        - channel
        - phone_number
      example:
        channel: sms
        phone_number: "+1234567890"
    VerificationChannel:
      type: string
      enum:
        - sms
    VerificationStatus:
      type: string
      enum:
        - pending
        - verified
        - failed
    CheckVerificationRequest:
      type: object
      properties:
        code:
          type: string
      required:
        - code
      example:
        code: "123456"
    VerificationId:
      type: string
      description: A string that uniquely identifies a Verification session
      maxLength: 100
      example: vrf_01KJBBNMQ5KF51SB7P5WH9RE16
    VerificationSessionDetails:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/VerificationId'
        channel:
          $ref: '#/components/schemas/VerificationChannel'
        phone_number:
          description: The phone number associated with the verification
          $ref: '#/components/schemas/Msisdn'
        expires_at:
          description: The expiration time of the verification
          $ref: '#/components/schemas/Iso8601DateTime'
        verified_at:
          description: Timestamp when the verification was successfully completed
          $ref: '#/components/schemas/Iso8601DateTime'
        attempts_used:
          type: integer
          description: Attempts already used for this verification
