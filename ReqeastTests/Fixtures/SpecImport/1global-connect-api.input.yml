          $ref: '#/components/schemas/AllowanceType'
        unit:
          type: string
          description: The balance unit
          enum:
            - bytes
            - minutes
            - count
        initial:
          type: integer
          format: int64
          description: The initial balance
        spent:
          type: integer
          format: int64
          description: The balance spent so far
        remaining:
          type: integer
          format: int64
          description: The remaining balance
        policies:
          $ref: '#/components/schemas/BalancePolicies'
      required:
        - type
        - allowance_type
        - unit
        - initial
        - spent
        - remaining
    BalanceUnlimited:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - unlimited
        allowance_type:
          $ref: '#/components/schemas/AllowanceType'
        unit:
          type: string
          description: The balance unit
          enum:
            - bytes
            - minutes
            - count
        spent:
          type: integer
          format: int64
          description: The balance spent so far
      required:
        - type
        - allowance_type
        - unit
    BalancePolicies:
      type: array
      description: The Policies of the Allowance
      minItems: 0
      items:
        $ref: "#/components/schemas/BalancePolicy"
    BalancePolicy:
      type: object
