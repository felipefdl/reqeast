      example:
        affiliate_id: "abcd-1234"
        custom_data: "100"
    OrderProductDiscount:
      type: object
      description: The Discount information
      oneOf:
        - $ref: '#/components/schemas/CreateDiscountAmount'
        - $ref: '#/components/schemas/CreateDiscountPercentage'
      discriminator:
        propertyName: type
        mapping:
          amount: '#/components/schemas/CreateDiscountAmount'
          percentage: '#/components/schemas/CreateDiscountPercentage'
    CreateDiscount:
      type: object
      description: The Discount information
      oneOf:
        - $ref: '#/components/schemas/CreateProductDiscountAmount'
        - $ref: '#/components/schemas/CreateProductDiscountPercentage'
      discriminator:
        propertyName: type
        mapping:
          amount: '#/components/schemas/CreateProductDiscountAmount'
          percentage: '#/components/schemas/CreateProductDiscountPercentage'
    CreateProductDiscountAmount:
       allOf:
        - type: object
          properties:
            product_id:
              $ref: '#/components/schemas/ProductId'
          required:
            - product_id
        - $ref: '#/components/schemas/CreateDiscountAmount'
