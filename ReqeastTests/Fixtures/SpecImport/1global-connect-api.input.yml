      allOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - amount
            amount_off:
              type: number
              description: The discount amount in fixed currency
            is_prorated:
              type: boolean
              description: Whether the discount could be prorated or not
              default: false
            points_redeemed:
              type: number
              description: Amount of redeemed points.
            currency:
              $ref: '#/components/schemas/CurrencyCode'
              description: The currency code for the discount amount
          required:
            - type
            - amount_off
            - currency
        - $ref: '#/components/schemas/CreateDiscountBase'
