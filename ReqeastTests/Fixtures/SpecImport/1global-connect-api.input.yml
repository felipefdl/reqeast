openapi: 3.1.0
info:
  title: 1GLOBAL Connect API
  description: |-
    1GLOBAL Connect is a set of APIs designed for server-to-server integration, accessible over the internet, that enables the provisioning of a variety of connectivity solutions to users. 

    The main goal of the API is to enable our partners to easily order, activate, and manage 1GLOBAL's global connectivity.
  version: '2026-02-05'
  x-logo:
    url: https://docs.connect.1global.com/img/logo.svg
    backgroundColor: '#FFFFFF'
    altText: 1Global
    href: '#'
servers:
  - url: https://api.1global.com/connect
security:
  - oAuth2: []
tags:
  - name: Accounts
    x-api: account
    description: Accounts represent business or personal accounts and can have a set of subscribers
  - name: Contracts
    x-api: contract
    description: Contract represent a legal agreement between a customer and a service provider
  - name: Coverage Areas
    x-api: catalog
    description: A Coverage Area defines the country (or countries) where a Product Offering can be used
  - name: Credit Notes
    x-api: credit-note
    description: The Credit Note represents a financial adjustment that decreases the total amount of a previously issued invoice. A credit note may be linked to an invoice or issued independently to provide credit to the customer
  - name: Discounts
    x-api: discount
    description: Discounts represent price reductions applied to products
  - name: Files
    x-api: file
    description: Files
  - name: Invoices
    x-api: invoice
    description: Invoices represent the billing of a set of products and services
  - name: Network Operators
    x-api: network-operator
    description: Network Operators
  - name: Orders
    x-api: order
    description: Orders are used to make purchases of products within a subscription
  - name: Phone Numbers
    x-api: phone-number
    description: Phone Numbers
  - name: Portings
    x-api: porting
    description: Portings represent portability requests for port-in and port-out of phone numbers
  - name: Porting Authorizations
    x-api: porting-authorization
    description: Porting Authorizations represent portability authorizations for phone numbers and msisdns
  - name: Product Catalogs
    x-api: catalog
    description: Product Catalogs aggregate a group of Product Offerings
  - name: Product Offerings
    x-api: catalog
    description: Product Offerings are blueprints for Products. You can access your Product Offerings via a single request. **Lists all product offerings** endpoint will show you the complete list of products and their respective Ids, which can be used in an order to activate/topup eSIM profiles.
  - name: Products
    x-api: product
    description: A Product is an instance of the Product Offering that has been ordered & provisioned. Products are created by placing a new Order and always have a Product Offering.
  - name: Renewal Groups
    x-api: renewals
    description: After purchasing a prepaid plan product offering, a renewal group is created to manage the recurring renewals of that product.
  - name: Renewals
    x-api: renewal
    description: A renewal represents one specific cycle within a renewal group.
  - name: SIM Profiles
    x-api: sim
    description: SIM profiles, activation codes and reservation management
  - name: Service Providers
    x-api: service-provider
    description: Service Providers
  - name: Subscribers
    x-api: subscriber
    description: Subscribers represent end users and can have a set of Subscriptions
  - name: Subscriptions
    x-api: subscription
    description: Subscriptions have SIM Profiles and bundled products that are purchased
  - name: Webhooks
    x-api: webhook
    description: Webhook endpoints
  - name: Verifications
    x-api: verification
    description: Verifications represent verification sessions used to confirm ownership of a phone number or an account
  - name: Events
    x-api: webhook
    description: Events are triggered when important domain transitions happen
paths:
  /accounts:
    post:
      x-api: account
      tags:
        - Accounts
      summary: Creates a new Account
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateAccount'
      responses:
        '201':
          $ref: '#/components/responses/CreateAccount_201'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
    get:
      x-api: account
      tags:
        - Accounts
      summary: List all accounts
      description: Returns a list of accounts
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListAccounts_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /accounts/{account-id}:
    get:
      x-api: account
      tags:
        - Accounts
      summary: Retrieve an account
      description: Retrieves the details of an existing account
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathAccountId'
      responses:
        '200':
          $ref: '#/components/responses/GetAccount_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      x-api: account
      tags:
        - Accounts
      summary: Patch an account
      description: Patch an account with metadata (https://docs.connect-api.1global.com/api/standards#metadata)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathAccountId'
      requestBody:
        $ref: '#/components/requestBodies/PatchAccount'
      responses:
        '200':
          $ref: '#/components/responses/PatchAccount_200'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '404':
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /verifications:
    post:
      x-api: verification
      tags:
        - Verifications
      summary: Create/Retry Verification
      operationId: createVerification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        $ref: '#/components/requestBodies/CreateVerification'
      responses:
        '200':
          $ref: '#/components/responses/CreateVerification_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimit'
        5XX:
          $ref: '#/components/responses/ServerError'
  /verifications/{verification-id}:
    get:
      x-api: verification
      tags:
        - Verifications
      summary: Retrieve a Verification
      operationId: getVerification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathVerificationId'
      responses:
        '200':
          $ref: '#/components/responses/GetVerification_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /verifications/{verification-id}/check:
    post:
      x-api: verification
      tags:
        - Verifications
      summary: Check a Verification Code
      operationId: checkVerification
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathVerificationId'
      requestBody:
        $ref: '#/components/requestBodies/CheckVerification'
      responses:
        '200':
          $ref: '#/components/responses/CheckVerification_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /coverage-areas:
    get:
      x-api: catalog
      tags:
        - Coverage Areas
      summary: List all Coverage Areas
      description: Returns a list of coverage areas
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Countries'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/GetCoverageAreas_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /coverage-areas/{coverage-area-id}:
    get:
      x-api: catalog
      tags:
        - Coverage Areas
      summary: Retrieve a Coverage Area
      description: Retrieves the details of an existing coverage area.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/CoverageAreaId'
      responses:
        '200':
          $ref: '#/components/responses/GetCoverageArea_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /product-offerings:
    get:
      x-api: catalog
      tags:
        - Product Offerings
      summary: Lists all Product Offerings
      description: Returns a list of product offerings
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ProductOfferingStatus'
        - $ref: '#/components/parameters/ProductOfferingType'
        - $ref: '#/components/parameters/AllowancesCountries'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/GetProductOfferings_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /product-offerings/{product-offering-id}:
    get:
      x-api: catalog
      tags:
        - Product Offerings
      summary: Retrieve a Product Offering
      description: Retrieves the details of an existing product offering
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ProductOfferingId'
      responses:
        '200':
          $ref: '#/components/responses/GetProductOffering_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      x-api: catalog
      tags:
        - Product Offerings
      summary: Partially updates a product offering
      description: >
        Currently supports only patching `name` and `metadata` fields.
        For `metadata` the following rules apply: 
        - Passing `null` for the `metadata` field clears all metadata.
        - Passing an empty object `{}` results in no changes to metadata.
        - Passing a key with a `null` value removes that specific key.
        - Passing a key with a value updates or adds that key.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: "#/components/parameters/ProductOfferingId"
      requestBody:
        $ref: "#/components/requestBodies/PatchProductOffering"
      responses:
        200:
          $ref: "#/components/responses/GetProductOffering_200"
        400:
          $ref: "#/components/responses/BadRequest"
        404:
          $ref: "#/components/responses/NotFound"
        5XX:
          $ref: "#/components/responses/ServerError"
  /product-offerings/{product-offering-id}/compatible:
    get:
      x-api: catalog
      tags:
        - Product Offerings
      summary: Lists all compatible Product Offerings
      description: Returns a list of product offerings compatible with this one
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ProductOfferingId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/GetProductOfferingAddons_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /product-catalogs:
    get:
      x-api: catalog
      tags:
        - Product Catalogs
      summary: List all Product Catalogs
      description: Returns a list of product catalogs
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/ProductCatalogName'
      responses:
        '200':
          $ref: '#/components/responses/GetProductCatalogs_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /product-catalogs/{product-catalog-id}:
    get:
      x-api: catalog
      tags:
        - Product Catalogs
      summary: Retrieve a Product Catalog
      description: Retrieves the details of a product catalog
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ProductCatalogId'
      responses:
        '200':
          $ref: '#/components/responses/ProductCatalog_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /product-catalogs/{product-catalog-id}/product-offerings:
    get:
      x-api: catalog
      tags:
        - Product Catalogs
      summary: List all Product Offerings of a Product Catalog
      description: Returns a list of product offerings from a specific product catalog
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/ProductCatalogId'
        - $ref: '#/components/parameters/ProductOfferingStatus'
        - $ref: '#/components/parameters/ProductOfferingType'
        - $ref: '#/components/parameters/AllowancesCountries'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/GetProductOfferings_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /products:
    get:
      x-api: product
      tags:
        - Products
      summary: List all products
      description: Returns a list of products
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ProductStatus'
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          $ref: '#/components/responses/ListProducts_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /products/{product-id}:
    get:
      x-api: product
      tags:
        - Products
      summary: Retrieve a product
      description: Retrieves the details of an existing product
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathProductId'
      responses:
        '200':
          $ref: '#/components/responses/GetProduct_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      x-api: product
      tags:
        - Products
      summary: Updates a product
      description: Updates prices in a product
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathProductId'
      requestBody:
        $ref: '#/components/requestBodies/PatchProduct'
      responses:
        200:
          $ref: '#/components/responses/GetProduct_200'
        404:
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /products/{product-id}/activate:
    post:
      x-api: product
      tags:
        - Products
      summary: Activate a Product
      description: Activates a product. Only products in status `scheduled` or `pending` with status_reason `first_usage_activation` can be activated.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathProductId'
      responses:
        '200':
          $ref: '#/components/responses/ActiveProduct_200'
        '404':
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /products/{product-id}/cancel:
    post:
      x-api: product
      tags:
        - Products
      summary: Cancel a Product
      description: Cancels a product. Only products in status `active`, `scheduled`, or `pending` with status_reason `first_usage_activation` can be canceled.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathProductId'
      requestBody:
        $ref: '#/components/requestBodies/CancelProduct'
      responses:
        '200':
          $ref: '#/components/responses/CancelProduct_200'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '404':
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /orders:
    post:
      x-api: order
      tags:
        - Orders
      summary: Creates a new Order
      description: Creates a new order for a subscriber.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateOrder'
      responses:
        '201':
          $ref: '#/components/responses/OrderCreated_201'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
    get:
      x-api: order
      tags:
        - Orders
      summary: List all Orders
      description: Returns a list of orders
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/OrderStatus'
      responses:
        '200':
          $ref: '#/components/responses/ListOrders_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /orders/{order-id}:
    get:
      x-api: order
      tags:
        - Orders
      summary: Retrieve an Order
      description: Retrieves the details of an existing order
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathOrderId'
      responses:
        '200':
          $ref: '#/components/responses/GetOrder_200'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
  /orders/{order-id}/cancel:
    post:
      x-api: order
      tags:
        - Orders
      summary: Cancels a scheduled or on-hold Order
      description: Cancels an order in scheduled or on-hold state only.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathOrderId'
      responses:
        '200':
          $ref: '#/components/responses/CanceledOrder_200'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '404':
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /orders/{order-id}/resume:
    post:
      x-api: order
      tags:
        - Orders
      summary: Resume an Order
      description: Resumes an on-hold Order
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathOrderId'
      requestBody:
        $ref: '#/components/requestBodies/ResumeOrder'
      responses:
        '200':
          $ref: '#/components/responses/ResumedOrder_200'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '404':
          $ref: '#/components/responses/NotFoundIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
  /subscribers:
    post:
      x-api: subscriber
      tags:
        - Subscribers
      summary: Creates a new Subscriber
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateSubscriber'
      responses:
        '201':
          $ref: '#/components/responses/CreateSubscriber_201'
        '400':
          $ref: '#/components/responses/BadRequestIdempotent'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        5XX:
          $ref: '#/components/responses/ServerErrorIdempotent'
    get:
      x-api: subscriber
      tags:
        - Subscribers
      summary: List all subscribers
      description: Returns a list of subscribers
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListSubscriber_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /subscribers/{subscriber-id}:
    get:
      x-api: subscriber
      tags:
        - Subscribers
      summary: Retrieve a subscriber
      description: Retrieves the details of an existing subscriber
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PathSubscriberId'
      responses:
        '200':
          $ref: '#/components/responses/GetSubscriber_200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        5XX:
          $ref: '#/components/responses/ServerError'
    patch:
      x-api: subscriber
      tags:
        - Subscribers
      summary: Updates a Subscriber
      description: Updates an existing Subscriber
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PathSubscriberId'
      requestBody:
        $ref: '#/components/requestBodies/PatchSubscriber'
      responses:
        '200':
