          $ref: '#/components/schemas/ThresholdAllowanceType'
        policy_type:
          $ref: '#/components/schemas/ThresholdPolicyType'
        percentage:
          type: integer
          description: The balance threshold percentage reached
      required:
        - allowance_type
        - percentage
    ThresholdAllowanceType:
      type: string
      enum:
        - data
      description: The type of the allowance
    ThresholdPolicyType:
      type: string
      enum:
        - roam_like_home
      description: The type of the allowance's policy
    AllowanceType:
      type: string
      enum:
        - data
        - voice
        - sms
      description: The type of the allowance
    AllowanceUnlimited:
      type: boolean
      description: Whether or not this allowance is unlimited. Unlimited allowances don't have `unit` and `unit_count` properties
    AllowanceUnit:
      type: string
      description: The Product Offering allowance unit
      enum:
        - bytes
        - megabytes
        - gigabytes
        - seconds
        - count
    Balance:
      oneOf:
        - $ref: '#/components/schemas/BalanceLimited'
        - $ref: '#/components/schemas/BalanceUnlimited'
      discriminator:
        propertyName: type
        mapping:
          limited: '#/components/schemas/BalanceLimited'
          unlimited: '#/components/schemas/BalanceUnlimited'
    BalanceLimited:
      type: object
      properties:
        type:
          type: string
