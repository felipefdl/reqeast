    ProductAcquiredAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product was acquired. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductStartAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product should start. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductStartedAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product actually started. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductEndAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product should end. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductEndedAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product actually ended. The reason should be given by the status (`depleted`, `terminated` or `canceled`). Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductExpireAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product should expired. This is the maximum date when the Product can be activated when the Activation Mode is `first_usage`. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductExpiredAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product actually expired. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductCycleEndAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product charging cycle will end and be renewed. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601). This property is deprecated and will be removed in the future, please use `billing_cycle_end_at` instead.
    ProductBillingCycleEndAt:
      $ref: '#/components/schemas/Iso8601DateTime'
      description: When the Product billing cycle will end and be renewed. Formated as [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
    ProductResponseBase:
      type: object
      properties:
        _embedded:
          type: object
          description: The resources related to the Product
          properties:
            product_offering:
              type: object
              description: The Product Offering from which this Product was created
              properties:
                id:
                  $ref: '#/components/schemas/ProductOfferingId'
                name:
                  $ref: '#/components/schemas/ProductOfferingName'
                type:
                  $ref: '#/components/schemas/ProductOfferingType'
                category:
                  $ref: '#/components/schemas/ProductOfferingTypeAddonCategory'
                validity:
                  $ref: '#/components/schemas/Validity'
                metadata:
                  $ref: "#/components/schemas/ProductOfferingMetadata"
                _embedded:
                  type: object
                  properties:
                    allowances:
                      $ref: '#/components/schemas/AllowancesDetailed'
                _links:
                  type: object
                  properties:
                    self:
                      $ref: '#/components/schemas/Link'
                  required:
                    - self
              required:
                - id
                - name
                - type
                - _links
            balances:
              type: array
              items:
                $ref: '#/components/schemas/Balance'
            prices:
              type: array
              description: The Prices for this Product which override the Product Offering ones.
              items:
                $ref: '#/components/schemas/Price'
            latest_renewal:
              $ref: '#/components/schemas/Renewal'
            phone_number:
              $ref: '#/components/schemas/ProductResponseEmbeddedPhoneNumber'
            applied_discounts:
              type: array
              description: Active discounts applied to this Product.
              items:
                $ref: '#/components/schemas/DiscountEmbedded'
          required:
            - product_offering
            - prices
      required:
        - _embedded
    ProductResponseEmbeddedPhoneNumber:
      type: object
      description: The Phone Number associated with the Product for addons of category additional_phone_number
      properties:
        id:
          $ref: '#/components/schemas/PhoneNumberId'
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
          required:
            - self
      required:
        - id
        - _links
    ProductLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
          description: The Product URI
        order:
          $ref: '#/components/schemas/Link'
          description: The Order URI
        subscription:
          $ref: '#/components/schemas/Link'
          description: The Subscription URI
      required:
        - self
    InvoiceProductLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
          description: The Product URI
      required:
        - self
    InvoiceDiscountLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
          description: The Discount URI
      required:
        - self
    InvoiceSubscriptionLinks:
      type: object
      properties:
        self:
          $ref: '#/components/schemas/Link'
          description: The Subscription URI
      required:
        - self
    ProductActivateLink:
      type: object
      properties:
        activate:
          $ref: '#/components/schemas/Link'
          description: The URI to activate this Product
    ProductCancelLink:
      type: object
      properties:
        cancel:
          $ref: '#/components/schemas/Link'
          description: The URI to cancel this Product
    QRCodeLink:
      type: object
      properties:
        href:
          type: string
          format: url
          example: https://api.1global.com/qrcode/v1/esim/LPA:1$rsp.truphone.com$5C-ZYXZZ-1R54O94
      required:
        - href
    NAAddress:
      allOf:
        - type: object
          description: Address format for US, requiring state.
          additionalProperties: false
          properties:
            line1:
              maxLength: 200
              type: string
            line2:
              maxLength: 200
              type: string
            city:
              maxLength: 200
              type: string
            state:
              $ref: '#/components/schemas/State'
            country:
              $ref: '#/components/schemas/Country'
            postal_code:
              $ref: '#/components/schemas/PostalCode'
          required:
            - country
            - state
    GlobalAddress:
      allOf:
        - type: object
          description: Address format for countries other than US, state is not required.
          additionalProperties: false
          properties:
            line1:
              maxLength: 200
              type: string
            line2:
              maxLength: 200
              type: string
            city:
              maxLength: 200
              type: string
            country:
              $ref: '#/components/schemas/Country'
            postal_code:
              $ref: '#/components/schemas/PostalCode'
          required:
            - country
    Iso8601DateTime:
      type: string
      format: date-time
      description: The Date Time format according to the [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601)
      example: '2024-10-01T14:28:17.456Z'
    Date:
      type: string
      format: date
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      minLength: 10
      maxLength: 10
      example: "2021-02-01"
    UnitAmount:
      type: integer
      minimum: 0
      example: 30
      description: The unit amount for the product, positive integer in cents (or 0 for a free price). This should be a whole number and represent the smallest unit of the currency.
    ProblemDetails:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
        correlation_id:
          type: string
        status:
          type: integer
        errors:
          $ref: '#/components/schemas/Errors'
      required:
        - title
    Errors:
      type: array
      description: An array of error details to accompany a problem details response.
      maxItems: 100
      items:
        $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        pointer:
          type: string
      required:
        - code
        - detail
    BalanceThresholdData:
      type: object
