openapi: 3.0.3
info:
  title: Multi-file Petstore
  description: OpenAPI bundle with external component files
  version: 1.0.0
servers:
  - url: https://petstore.example.test/api/v1
    description: Production server
tags:
  - name: pet
    description: Pet operations
paths:
  /pet:
    get:
      tags:
        - pet
      summary: List all pets
      operationId: listPets
      parameters:
        - $ref: components/parameters/limit.yaml
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: components/schemas/Pet.yaml
    post:
      tags:
        - pet
      summary: Add a new pet
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: components/schemas/Pet.yaml
            example:
              name: Fluffy
              status: available
      responses:
        "201":
          description: Created
  /pet/{petId}:
    get:
      tags:
        - pet
      summary: Find pet by ID
      operationId: getPetById
      parameters:
        - $ref: components/parameters/petId.yaml
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: components/schemas/Pet.yaml