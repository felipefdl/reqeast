openapi: 3.0.0
info:
  title: Cyclic Ref
  version: 1.0.0
paths:
  /nodes:
    post:
      summary: Create node
      operationId: createNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Node"
      responses:
        "201":
          description: created
components:
  schemas:
    Node:
      type: object
      properties:
        value:
          type: string
          example: root
        child:
          $ref: "#/components/schemas/Node"