# Phase 1 CI: Rust core + reqeast-mcp (no Xcode / Swift; needs Xcode 26.4+ runners later).
#
# Action majors (checked 2026-07-23 against GitHub releases / maintainer READMEs):
#   actions/checkout@v7          (latest: v7.0.1)
#   actions/setup-node@v7        (latest: v7.0.0)
#   dtolnay/rust-toolchain@stable  (maintainer example uses checkout@v7)
#   Swatinem/rust-cache@v2       (latest: v2.9.1)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin to crate MSRV (Cargo.toml rust-version = "1.88"). Avoids newer clippy
      # lints (e.g. collapsible_if on 1.97) failing CI while local toolchains drift.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # Match `just lint-rust` / `just test-rust` (default features).
      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

  mcp:
    name: reqeast-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reqeast-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # package.json engines: node >= 18. Use current Node 22 LTS.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reqeast-mcp/package-lock.json

      # package.json declares "os": ["darwin"] for npm consumers; CI only typechecks
      # the TypeScript sources, so force install on Linux runners.
      - name: Install dependencies
        run: npm ci --force

      - name: Build
        run: npm run build
